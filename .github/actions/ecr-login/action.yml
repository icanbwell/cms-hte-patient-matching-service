name: ECR login (services account)
description: >
  Authenticate to the services account (856965016623) that owns the
  root-mirror ECR repo Dockerfiles pull their Root.io hardened base image
  from, then log in to Amazon ECR.
runs:
  using: composite
  steps:
    - name: Configure AWS credentials (services account for ECR)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: us-east-1
        role-to-assume: arn:aws:iam::856965016623:role/services-k8s-service-account-github-actions-runner
        role-session-name: ${{ github.run_id }}-ecr

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2
