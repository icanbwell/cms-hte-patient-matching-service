name: Build and Test

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # validate-packages (icanbwell/actions' validate-pip-packages.yaml reusable workflow) was
  # removed from here: this repo is now public (temporary Render demo), and a public repo
  # cannot call a reusable workflow hosted in a private repo (icanbwell/actions is private;
  # GitHub's org-wide reusable-workflow access setting only extends to other private/internal
  # repos in the org). See icanbwell/bwell-cms-hte-patient-matching-service/README.md for why
  # this wasn't moved there either (that repo's own checkout can't validate this repo's
  # dependencies without reproducing a dependency-overlay setup disproportionate to a
  # temporary public state) -- this is a documented gap, not a fix.
  build_and_test:
    # Was ubuntu-latest (GitHub-hosted) -- switched to the self-hosted `main`
    # runner pool. The pre-commit/up steps below now pull root-mirror/python,
    # which needs the services-account ECR login below; that role
    # (services-k8s-service-account-github-actions-runner) is only reachable
    # via the self-hosted runners' Kubernetes-service-account-federated
    # identity, not GitHub's native Actions OIDC -- confirmed by testing on
    # ubuntu-latest, which failed with "web identity token provided could not
    # be validated" even with `permissions: id-token: write` set. Every other
    # already-migrated repo's equivalent job (ats-event-consumer's
    # checks.yml, icanbwell/bwell-cms-hte-patient-matching-service's docker-publish.yml)
    # already runs on `main` for the same reason.
    runs-on: main
    # JFrog creds are needed by both the pre-commit step (builds pre-commit.Dockerfile,
    # which runs `uv sync` against the now-default JFrog index) and the `up`/`tests` steps
    # (build the main Dockerfile via docker-compose, whose secrets: block reads these same
    # env vars).
    env:
      JFROG_READ_USER: ${{ secrets.JFROG_READ_USER }}
      JFROG_READ_TOKEN: ${{ secrets.JFROG_READ_TOKEN }}

    steps:
      # Checks-out your repository
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Both the pre-commit step below (builds pre-commit.Dockerfile) and the
      # `up`/`tests` steps (build the main Dockerfile via docker-compose) FROM
      # root-mirror/python, which lives in the services account (856965016623)
      # -- a separate account from wherever this repo's own images publish to,
      # needing its own role-to-assume rather than any ambient runner credentials.
      - name: ECR login (services account, for root-mirror base image pulls)
        uses: ./.github/actions/ecr-login

      # The self-hosted `main` runner image doesn't ship `make` or a modern
      # Docker Compose CLI plugin -- unlike ubuntu-latest, which has both
      # preinstalled. Matches the pattern already used by other repos' `main`
      # runner CI (e.g. ats-event-consumer, helix.providersearch).
      - name: Install make
        run: |
          sudo apt-get update && sudo apt-get install -y make
          sudo apt-get clean

      # Verified against the release's published sha256 checksum, not just
      # downloaded and run blind -- same pattern already used by
      # ats-event-consumer's install-docker-compose action.
      - name: Install Docker Compose CLI plugin
        run: |
          set -eu
          DC_VERSION=v2.24.6
          DC_ASSET="docker-compose-linux-x86_64"
          DC_URL="https://github.com/docker/compose/releases/download/${DC_VERSION}/${DC_ASSET}"
          mkdir -p ~/.docker/cli-plugins/
          curl -SL "${DC_URL}" -o /tmp/docker-compose
          curl -SL "${DC_URL}.sha256" -o /tmp/docker-compose.sha256
          echo "$(cut -d' ' -f1 /tmp/docker-compose.sha256)  /tmp/docker-compose" | sha256sum -c -
          mv /tmp/docker-compose ~/.docker/cli-plugins/docker-compose
          chmod +x ~/.docker/cli-plugins/docker-compose
          docker compose version

      - name: create .env
        run: |
          touch ./.env

      - name: pre-commit
        run: make run-pre-commit && make clean-pre-commit

      - name: Set correct permissions for tests
        run: |
          sudo chmod -R 777 ${{ github.workspace }}

      - name: Create reports output folder
        run: |
          mkdir -p ${{ github.workspace }}/reports
          chmod -R 777 ${{ github.workspace }}/reports


      # setup and install everything and run tests
      - name: up
        run: make up

      - name: tests
        run: |
          docker compose run --rm --name patient-matching-service-tests -v ${{ github.workspace }}/reports:/reports dev pytest . --tb=auto --junitxml=/reports/test-results.xml

      - name: Upload pytest test results
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results
          path: ${{ github.workspace }}/reports/**/*.xml
        # Use always() to always run this step to publish test results when there are test failures
        if: ${{ always() }}

      - name: Verify reports are generated
        if: ${{ always() }}
        run: ls -halt ${{ github.workspace }}/reports/

      # Publish all test results in the GitHub UI
      - name: Surface failing tests
        if: always()
        uses: pmeier/pytest-results-action@fdc7f18d9934e38aca411ca9557e6577bd25ca9c # https://github.com/pmeier/pytest-results-action
        with:
          # A list of JUnit XML files, directories containing the former, and wildcard
          # patterns to process.
          # See @actions/glob for supported patterns.
          path: ${{ github.workspace }}/reports/*.xml

          # (Optional) Add a summary of the results at the top of the report
          summary: true

          # (Optional) Select which results should be included in the report.
          # Follows the same syntax as `pytest -r`
          display-options: fEX

          # (Optional) Fail the workflow if no JUnit XML was found.
          fail-on-empty: true

          # (Optional) Title of the test results section in the workflow summary
          title: Test results

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v --remove-orphans

      - name: 'Cleanup build folder'
        if: always()
        run: |
          ls -la ./
          sudo rm -rf ${{ github.workspace }}/*
          ls -la ./
