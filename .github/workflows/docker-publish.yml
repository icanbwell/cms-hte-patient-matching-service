name: Deploy to ECR (multi-arch)

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: docker-publish-${{ github.workflow }}-${{ github.event.release.tag_name || github.sha }}
  cancel-in-progress: false

env:
  IMAGE_NAME: patient-matching-service
  REPOSITORY_URL: 856965016623.dkr.ecr.us-east-1.amazonaws.com

jobs:
  validate-packages:
    uses: icanbwell/actions/.github/workflows/validate-pip-packages.yaml@main
    with:
      working-directory: .
    secrets: inherit  # pragma: allowlist secret -- not a literal secret, standard GHA syntax

  build-amd64:
    needs: [validate-packages]
    runs-on: main
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Separate from the login above: that one authenticates for pushing this
      # repo's own built image, using this runner's ambient role. Pulling the
      # Dockerfile's root-mirror/python base image needs a different login --
      # that image lives in the services account (856965016623), which the
      # ambient role doesn't have access to.
      - name: ECR login (services account, for root-mirror base image pulls)
        uses: ./.github/actions/ecr-login

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute image tag
        id: vars
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build AMD64 image (no push) and export as tar
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          target: production
          secrets: |  # pragma: allowlist secret -- not a literal secret, standard GHA syntax
            jfrog_read_user=${{ secrets.JFROG_READ_USER }}
            jfrog_read_token=${{ secrets.JFROG_READ_TOKEN }}
          tags: |
            ${{ env.REPOSITORY_URL }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}-amd64
          outputs: type=docker,dest=/tmp/amd64-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload AMD64 image artifact
        uses: actions/upload-artifact@v7
        with:
          name: amd64-image-${{ steps.vars.outputs.tag }}
          path: /tmp/amd64-image.tar
          if-no-files-found: error

  build-arm64:
    needs: [validate-packages]
    runs-on: main-arm
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Separate from the login above: that one authenticates for pushing this
      # repo's own built image, using this runner's ambient role. Pulling the
      # Dockerfile's root-mirror/python base image needs a different login --
      # that image lives in the services account (856965016623), which the
      # ambient role doesn't have access to.
      - name: ECR login (services account, for root-mirror base image pulls)
        uses: ./.github/actions/ecr-login

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute image tag
        id: vars
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ARM64 image (no push) and export as tar
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: false
          target: production
          secrets: |  # pragma: allowlist secret -- not a literal secret, standard GHA syntax
            jfrog_read_user=${{ secrets.JFROG_READ_USER }}
            jfrog_read_token=${{ secrets.JFROG_READ_TOKEN }}
          tags: |
            ${{ env.REPOSITORY_URL }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}-arm64
          outputs: type=docker,dest=/tmp/arm64-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload ARM64 image artifact
        uses: actions/upload-artifact@v7
        with:
          name: arm64-image-${{ steps.vars.outputs.tag }}
          path: /tmp/arm64-image.tar
          if-no-files-found: error

  publish-amd64:
    needs: [build-amd64]
    runs-on: main
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag
        id: vars
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download AMD64 image artifact
        uses: actions/download-artifact@v8
        with:
          name: amd64-image-${{ steps.vars.outputs.tag }}
          path: /tmp

      - name: Load AMD64 image and push to ECR
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          docker load -i /tmp/amd64-image.tar
          docker push ${{ env.REPOSITORY_URL }}/${{ env.IMAGE_NAME }}:${TAG}-amd64

  publish-arm64:
    needs: [build-arm64]
    runs-on: main
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag
        id: vars
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download ARM64 image artifact
        uses: actions/download-artifact@v8
        with:
          name: arm64-image-${{ steps.vars.outputs.tag }}
          path: /tmp

      - name: Load ARM64 image and push to ECR
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          docker load -i /tmp/arm64-image.tar
          docker push ${{ env.REPOSITORY_URL }}/${{ env.IMAGE_NAME }}:${TAG}-arm64

  manifest:
    needs: [publish-amd64, publish-arm64]
    runs-on: main
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute manifest tag
        id: vars
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push multi-arch manifest (release tag)
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          docker buildx imagetools create \
            -t ${{ env.REPOSITORY_URL }}/${{ env.IMAGE_NAME }}:${TAG} \
            ${{ env.REPOSITORY_URL }}/${{ env.IMAGE_NAME }}:${TAG}-amd64 \
            ${{ env.REPOSITORY_URL }}/${{ env.IMAGE_NAME }}:${TAG}-arm64