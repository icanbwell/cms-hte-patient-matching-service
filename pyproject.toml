[project]
name = "patient-matching-service"
version = "0.1.0"
description = ""
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.32.4",
    "ariadne>=0.22",
    "fastapi>=0.110.0",
    "boto3>=1.34.59",
    "uvicorn>=0.28.0",
    "opentelemetry-distro>=0.48b0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-logging>=0.48b0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "python-crfsuite>=0.9.11",
    "httpx>=0.27.2",
    "mcp>=1.11.0",
    "fastmcp>=2.11.0",
    "authlib>=1.6.1",
    "joserfc>=1.2.2",
]

[dependency-groups]
dev = [
    "wheel>=0.43.0",
    "pre-commit>=3.8.0",
    "autoflake>=2.3.1",
    "mypy>=1.11.2",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "black>=24.8.0",
    "deepdiff[murmur]>=8.0.1",
    "types-requests",
    "types-beautifulsoup4>=4.12.0.20241020",
    "openai>=1.97.0",
    "asgi-lifespan>=2.1.0",
    "respx>=0.22.0",
    "types-Authlib>=1.6.0",
    "bandit>=1.8.3",
    "ruff>=0.11.5",
    "types-boto3>=1.40.0",
]

[tool.pytest.ini_options]
addopts = "--capture=fd"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
