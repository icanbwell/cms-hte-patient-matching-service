[project]
name = "patient_matching_service"
version = "0.1.0"
description = "FastAPI service for patient matching with FHIR integration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "ddtrace>=2.6.3",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "python-json-logger>=3.2.1",
    "pyjwt[crypto]>=2.9.0",
    "httpx>=0.27.2",
    "cms-hte-patient-matching>=0.0.5",
]

[dependency-groups]
dev = [
    "wheel>=0.43.0",
    "pre-commit>=3.8.0",
    "autoflake>=2.3.1",
    "mypy>=1.11.2",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "black>=24.8.0",
    "asgi-lifespan>=2.1.0",
    "bandit>=1.8.3",
    "ruff>=0.16.5",
]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.uv]
# This is a service, not a publishable package -- uv sync only installs
# dependencies; app code is COPY'd into the Docker image, not pip installed.
package = false

[[tool.uv.index]]
name = "jfrog"
url = "https://artifacts.bwell.com/artifactory/api/pypi/virtual-pypi/simple"
# Must be `default = true`, not `explicit = true`. `explicit` only routes
# packages listed under [tool.uv.sources] -- with nothing mapped there
# (as this repo had), every dependency silently kept resolving against the
# public index instead, despite this block's presence. `default` routes
# everything through JFrog unless a package is overridden elsewhere.
default = true

[tool.pytest.ini_options]
addopts = "--capture=fd"
anyio_backend = "asyncio"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["prometheus_fastapi_instrumentator"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["prometheus_fastapi_instrumentator.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
exclude = ["venv/"]

[tool.ruff.lint]
# B008 (flake8-bugbear): "no function calls in argument defaults" -- FastAPI's
# entire Depends()-based DI system is built on exactly this pattern, so this
# rule is a standing false positive for any FastAPI route/dependency. See
# https://fastapi.tiangolo.com/tutorial/dependencies/ -- ruff's own docs
# recommend disabling B008 for FastAPI codebases.
ignore = ["B008"]
