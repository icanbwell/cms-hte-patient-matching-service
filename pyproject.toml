[project]
name = "patient_matching_service"
version = "0.1.0"
description = "FastAPI service for patient matching with FHIR integration"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "python-json-logger>=3.2.1",
    "pyjwt[crypto]>=2.9.0",
    "httpx>=0.27.2",
    "cms-hte-ial2-reader>=0.0.4",
]

[project.optional-dependencies]
# Pulls in duckdb, which has no public musllinux (Alpine) wheel for the version this repo
# needs -- only a JFrog-hosted one (see icanbwell/python-alpine-wheels), so installing this
# extra on Alpine requires JFrog access. Split out so the default build (this repo is
# temporarily public; JFrog secrets don't reach it, BAI-894) can install everything else
# from public sources and skip $match support, while the hardened build
# (icanbwell/bwell-cms-hte-patient-matching-service's bwell.Dockerfile, which has JFrog
# access) installs this extra and ships full functionality. See Dockerfile's
# INSTALL_MATCHING_ENGINE build arg and patient_matching_service/service/match_controller.py's
# MATCHING_ENGINE_AVAILABLE guard.
matching = [
    "cms-hte-patient-matching>=0.0.11",
]

[dependency-groups]
dev = [
    "wheel>=0.43.0",
    "pre-commit>=3.8.0",
    "autoflake>=2.3.1",
    "mypy>=1.11.2",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "black>=24.8.0",
    "asgi-lifespan>=2.1.0",
    "bandit>=1.8.3",
    "ruff>=0.16.5",
    # pip-licenses is needed for `make third-party-notices`
    "pip-licenses>=5.0.0",
]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.uv]
# This is a service, not a publishable package -- uv sync only installs
# dependencies; app code is COPY'd into the Docker image, not pip installed.
package = false
# No JFrog index here (unlike icanbwell/bwell-cms-hte-patient-matching-service's
# bwell.Dockerfile, which still resolves through JFrog): this repo is temporarily public
# (BAI-894), and org-scoped JFrog secrets don't reach it. Resolves against public PyPI
# directly, matching icanbwell/kill-the-clipboard-scanner's own pyproject.toml. The
# `matching` extra's duckdb dependency has no public musllinux (Alpine) wheel, so
# Dockerfile's INSTALL_MATCHING_ENGINE=true path compiles it from source instead of
# fetching a prebuilt wheel (which is what bwell.Dockerfile's JFrog access buys it).

[tool.pytest.ini_options]
addopts = "--capture=fd"
anyio_backend = "asyncio"
# "strict", not "auto": auto-mode detection silently doesn't work in this repo (anyio's
# pytest plugin is also registered alongside pytest-asyncio, and that combination breaks
# pytest-asyncio's auto-mode under pytest 9.1.1 -- confirmed directly, every async test/
# fixture was failing with "async def functions are not natively supported" despite
# asyncio_mode = "auto" being set). Every async test/fixture now carries an explicit
# @pytest.mark.asyncio/@pytest_asyncio.fixture, so "strict" is both accurate and makes a
# future test that forgets the marker fail loudly instead of silently not running async.
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["prometheus_fastapi_instrumentator"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["prometheus_fastapi_instrumentator.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The `matching` extra (cms-hte-patient-matching) isn't installed in every build --
# see Dockerfile's INSTALL_MATCHING_ENGINE and match_controller.py's
# MATCHING_ENGINE_AVAILABLE. pre-commit.Dockerfile's lint image doesn't install it at
# all, so mypy needs this even when the extra IS present elsewhere.
module = ["patient_matching", "patient_matching.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
exclude = ["venv/"]

[tool.ruff.lint]
# B008 (flake8-bugbear): "no function calls in argument defaults" -- FastAPI's
# entire Depends()-based DI system is built on exactly this pattern, so this
# rule is a standing false positive for any FastAPI route/dependency. See
# https://fastapi.tiangolo.com/tutorial/dependencies/ -- ruff's own docs
# recommend disabling B008 for FastAPI codebases.
ignore = ["B008"]
